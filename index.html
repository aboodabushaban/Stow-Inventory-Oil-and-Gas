document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

  </script>

e-linecap=\"round\" stroke-linejoin=\"round\"><circle cx=\"12\" cy=\"12\" r=\"4\"><\u002Fcircle><path d=\"M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41\"><\u002Fpath><\u002Fsvg>\n      <\u002Fsc-if>\n    <\u002Fbutton>\n    <div style=\"background:var(--surface);border-radius:14px;padding:32px;width:400px;max-width:100%;border:1.5px solid var(--border-accent);box-shadow:0 0 20px rgba(50,38,15,0.14);\">\n      <div style=\"font-size:36px;font-weight:400;margin-bottom:2px;color:#c67139;position:relative;\">\n        <span class=\"stow-logo\" style=\"font-size:36px;\">\n          <span class=\"stow-splash\" style=\"width:30px;height:22px;background:#3f6fd6;border-radius:60% 40% 55% 45%/45% 55% 45% 55%;top:-5px;left:-6px;opacity:.3;transform:rotate(-10deg);\"><\u002Fspan>\n          <span style=\"position:relative;z-index:1;\">STOW<\u002Fspan>\n        <\u002Fspan>\n      <\u002Fdiv>\n      <div style=\"font-size:13px;color:var(--ink-muted);margin-bottom:22px;margin-top:8px;\">Sign in to continue — every action is logged under your name.<\u002Fdiv>\n      <div style=\"font-size:12px;font-weight:700;color:var(--ink-faint);margin-bottom:6px;\">Your Name<\u002Fdiv>\n      <input value=\"{{ loginNameInput }}\" sc-camel-on-change=\"{{ onLoginNameChange }}\" placeholder=\"e.g. A. Hassan\" style=\"width:100%;padding:10px 12px;margin-bottom:14px;border:1.5px solid var(--border-accent);border-radius:12px;font-size:13px;\">\n      <div style=\"font-size:12px;font-weight:700;color:var(--ink-faint);margin-bottom:6px;\">Job Title<\u002Fdiv>\n      <sc-raw-select value=\"{{ loginTitleInput }}\" sc-camel-on-change=\"{{ onLoginTitleChange }}\" style=\"width:100%;padding:10px 12px;margin-bottom:8px;border:1.5px solid var(--border-accent);border-radius:12px;font-size:13px;\">\n        <option value=\"\">Choose title…<\u002Foption>\n        <sc-for list=\"{{ titleOptions }}\" as=\"t\" hint-placeholder-count=\"12\">\n          <option value=\"{{ t }}\">{{ t }}<\u002Foption>\n        <\u002Fsc-for>\n      <\u002Fsc-raw-select>\n      <div style=\"font-size:11px;color:var(--ink-muted);margin-bottom:18px;\">{{ loginRoleHint }}<\u002Fdiv>\n      <sc-if value=\"{{ loginError }}\" hint-placeholder-val=\"{{ false }}\">\n        <div style=\"background:var(--notice-red-bg);color:var(--notice-red-text);border-radius:12px;padding:9px 12px;margin-bottom:14px;font-size:12px;\">Enter your name and select a title to continue.<\u002Fdiv>\n      <\u002Fsc-if>\n      <button sc-camel-on-click=\"{{ doLogin }}\" style=\"width:100%;padding:11px;border-radius:12px;border:1.5px solid var(--border-accent);background:#1f3566;color:#fff;font-size:13px;font-weight:700;cursor:pointer;\">Log In<\u002Fbutton>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsc-if>\n\n\n  \n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\">\n\nconst GREEN_BG = '#e8f5e9', GREEN_FG = '#1e7d32';\nconst RED_BG = '#fdeaea', RED_FG = '#c0392b';\nconst BLUE_BG = '#eaf1fb', BLUE_FG = '#1f5fa8';\nconst YELLOW_BG = '#fdf3d6', YELLOW_FG = '#8a6a00';\nconst DEEP_BLUE = '#1f3566';\nconst GREY_TEXT = '#6b6459';\nconst EDIT_TITLES = ['Procurement Manager', 'Procurement Officer', 'Store Officer', 'Material Controller', 'Store Keeper', 'Admin Assistant'];\nconst VIEW_TITLES = ['Managing Director', 'General Manager', 'Operations Manager', 'Workshop Manager', 'QHSE Manager'];\nconst APPROVAL_TITLES = ['Managing Director', 'General Manager', 'Operations Manager', 'Procurement Manager', 'Accounts Manager'];\nconst COMMS_TITLES = ['Procurement Officer', 'Procurement Manager', 'Operations Manager', 'Managing Director', 'General Manager'];\nconst ALL_TITLES = [...new Set([...EDIT_TITLES, ...VIEW_TITLES, ...APPROVAL_TITLES])];\n\nfunction daysBetween(dateStr) {\n  if (!dateStr) return null;\n  const d = new Date(dateStr + 'T00:00:00');\n  const now = new Date();\n  return Math.round((d - now) / 86400000);\n}\nfunction fmtDate(d){ return d || '—'; }\nfunction csvEscape(v){ const s = String(v == null ? '' : v); return /[\",\\n]/.test(s) ? '\"' + s.replace(/\"/g, '\"\"') + '\"' : s; }\nfunction parseCSVLine(line){\n  const result=[]; let cur='', inQ=false;\n  for(let i=0;i<line.length;i++){\n    const c=line[i];\n    if(inQ){ if(c==='\"'){ if(line[i+1]==='\"'){cur+='\"';i++;} else inQ=false; } else cur+=c; }\n    else { if(c==='\"') inQ=true; else if(c===','){ result.push(cur); cur=''; } else cur+=c; }\n  }\n  result.push(cur);\n  return result;\n}\nfunction parseCSVWithHeader(text){\n  const lines = text.split(/\\r?\\n/).filter(l => l.trim() !== '');\n  if (!lines.length) return [];\n  const header = parseCSVLine(lines[0]).map(h => h.trim());\n  return lines.slice(1).map(line => {\n    const cols = parseCSVLine(line);\n    const obj = {};\n    header.forEach((h, i) => { obj[h] = cols[i] !== undefined ? cols[i] : ''; });\n    return obj;\n  });\n}\nfunction downloadCSV(filename, rows){\n  const csv = rows.map(r => r.map(csvEscape).join(',')).join('\\n');\n  const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });\n  const url = URL.createObjectURL(blob);\n  const a = document.createElement('a');\n  a.href = url; a.download = filename; document.body.appendChild(a); a.click();\n  document.body.removeChild(a); URL.revokeObjectURL(url);\n}\n\nclass Component extends DCLogic {\n  state = {\n    role: 'manager',\n    currentUser: null,\n    loginNameInput: '',\n    loginTitleInput: '',\n    activityLog: [],\n    view: 'dashboard',\n    ppeTab: 'stock',\n    isMobile: false,\n    sidebarOpen: true,\n    sidebarCollapsed: false,\n    sidebarGroupOpen: { inventory: true, intake: true, activity: true },\n    expandedCharts: { cat: false, health: false, pr: false, tx: false },\n    showBackToTop: false,\n    itemDetail: null,\n    addItemModal: { open: false },\n    printPR: null,\n    printComparison: null,\n    txForm: { barcodeInput: '', type: 'receive', qty: '', site: 'FE-MIC', feNumber: '', notes: '', receiveCategory: '', receiveQuery: '', receiveLocation: '', receiveSubCategory: '', receiveUnit: '', receiveWeeklyUsage: '', receiveExpiry: '', gasLocation: '', receiveQueryOpen: false, receiveLocationOpen: false, receiveLocationLocked: true, gasLocationLocked: true, issueCategory: '', issueItemId: '' },\n    locationConfirm: null,\n    removeLocationConfirm: null,\n    editingLocGeneric: null,\n    editingNotes: null,\n    units: ['pcs', 'Nos.', 'KG', 'Ltr', 'Pair', 'box', 'roll', 'set', 'mtr', 'bag', 'drum', 'unit'],\n    newUnitInput: '',\n    storeLocations: (window.LOCATIONS_DATA || []).slice(),\n    gasLocations: (window.GAS_LOCATIONS || []).slice(),\n    containerLocations: (window.CONTAINER_LOCATIONS || []).slice(),\n    newContainerLocationInput: '',\n    newStoreLocationInput: '',\n    newGasLocationInput: '',\n    prForm: { site: 'FE-MIC', department: 'Store', notes: '', requiredDate: '', items: [1, 2, 3, 4, 5].map(n => ({ serial: n, jobNo: '', description: '', type: '', grade: '', qty: '', unit: 'Nos.' })) },\n    prDetailId: null,\n    attentionDraft: '',\n    prFormError: null,\n    prFormFieldErrors: null,\n    mdNotesDraft: {},\n    prDescOpenIdx: null,\n    darkMode: false,\n    unitRequests: [],\n    newUnitRequestInput: '',\n    settingsTab: 'preferences',\n    comparisonAttempt: {},\n    lpoAttempt: {},\n    stockListSearch: '',\n    prFilter: 'All',\n    activityFilter: 'All',\n    searches: { liftingTackles: '', consumables: '', equipmentTracker: '', fixedAssets: '', electrodes: '' },\n    electrodesTab: 'all',\n    electrodesVendorTab: 'ESAB',\n    electrodesCategoryFilter: '',\n    electrodesSort: null,\n    liftingTab: 'active',\n    liftingCategoryFilter: '',\n    liftingSort: null,\n    liftingLocationFilter: '',\n    confirmDisposal: false,\n    confirmQuarantine: false,\n    editingQty: null,\n    editingLocationId: null,\n    itemDetailStockEdit: null,\n    equipmentGroup: 'welding',\n    equipmentTab: 'active',\n    equipmentCategoryFilter: '',\n    editingCertExpiryId: null,\n    itemDetailEquipEdit: null,\n    disposalAttachDraft: { stakeholder: '', fileName: '' },\n    ppeSort: null,\n    ppeSearch: '',\n    ppeCategoryFilter: '',\n    consumablesTab: 'all',\n    consumablesCategoryFilter: '',\n    consumablesSort: null,\n    gasTab: 'stock',\n    gasCategoryFilter: '',\n    gasSort: null,\n    gasSearch: '',\n    itemDetailEdit: null,\n    data: {\n      liftingTackles: { label: 'Lifting Tackles', unitType: 'equipment', items: (window.INVENTORY_DATA && window.INVENTORY_DATA.liftingTackles) || [] },\n      consumables: { label: 'Consumables', unitType: 'stock', targetWeeks: 2, items: (window.INVENTORY_DATA && window.INVENTORY_DATA.consumablesWelding) || [] },\n      equipmentTracker: { label: 'Equipments', unitType: 'equipment', items: (window.INVENTORY_DATA && window.INVENTORY_DATA.equipmentTracker) || [] },\n      electrodes: { label: 'Welding Electrodes', unitType: 'stock', targetWeeks: 4, items: (window.INVENTORY_DATA && window.INVENTORY_DATA.electrodes) || [] },\n    },\n    ppeStock: (window.INVENTORY_DATA && window.INVENTORY_DATA.ppeStock) || [],\n    gasStock: (window.INVENTORY_DATA && window.INVENTORY_DATA.gasStock) || [],\n    ppeIssuance: [],\n    employeeHistorySearch: '',\n    selectedEmployeeId: null,\n    employeeAddForm: { itemId: '', qty: '' },\n    transactions: [],\n    prs: [\n      { id: 'STR/001/2026', department: 'Store', year: 2026, site: 'QAPCO', requestedBy: 'A. Hassan', status: 'Pending', notes: '', requiredDate: '2026-08-05', dateCreated: '2026-07-22', comparison: null, lpoSuffix: '', lpoNumber: null,\n        items: [{ id: 'STR/001/2026-1', serial: 1, jobNo: 'J-2201', description: 'Wire rope sling 5T', type: 'Lifting Sling', grade: 'EN 13414, 5T SWL, 2m', qty: 4, unit: 'pcs' }] },\n      { id: 'W/S/001/2026', department: 'Workshop', year: 2026, site: 'QATALUM', requestedBy: 'M. Khalifa', status: 'Awaiting RFQ', notes: 'Urgent for turnaround', requiredDate: '2026-08-01', dateCreated: '2026-07-20', lpoSuffix: '', lpoNumber: '',\n        items: [{ id: 'W/S/001/2026-1', serial: 1, jobNo: 'J-1187', description: 'Welding electrode E6013', type: 'Electrode', grade: '25kg, 3.2mm', qty: 25, unit: 'kg' }],\n        comparison: { vendors: ['Gulf Gear Supplies', 'Doha Industrial Co', 'Qatar Steel Traders'], items: [{ itemId: 'W/S/001/2026-1', description: 'Welding electrode E6013', quotes: [{ price: 1450, leadTimeValue: '5', leadTimeUnit: 'Days', availability: 'Lead Time' }, { price: 1510, leadTimeValue: '9', leadTimeUnit: 'Days', availability: 'Lead Time' }, { price: 1600, leadTimeValue: '', leadTimeUnit: 'Days', availability: 'Ex-Stock' }], selected: 0 }] } },\n      { id: 'STR/002/2026', department: 'Store', year: 2026, site: 'FE-MIC', requestedBy: 'S. Ibrahim', status: 'LPO Raised', notes: '', requiredDate: '2026-08-10', dateCreated: '2026-07-10', lpoSuffix: '00031', lpoNumber: 'LPO/2026/00031',\n        items: [{ id: 'STR/002/2026-1', serial: 1, jobNo: 'J-0876', description: 'Safety harness restock', type: 'PPE', grade: 'Full body, EN 361', qty: 10, unit: 'pcs' }],\n        comparison: { vendors: ['Al Fardan Trading', 'Gulf Gear Supplies', 'Doha Industrial Co'], items: [{ itemId: 'STR/002/2026-1', description: 'Safety harness restock', quotes: [{ price: 620, leadTimeValue: '', leadTimeUnit: 'Days', availability: 'Ex-Stock' }, { price: 645, leadTimeValue: '9', leadTimeUnit: 'Days', availability: 'Lead Time' }, { price: 690, leadTimeValue: '2', leadTimeUnit: 'Weeks', availability: 'Lead Time' }], selected: 0 }] } },\n    ],\n  };\n\n  componentDidMount() {\n    this.updateSize();\n    window.addEventListener('resize', this.updateSize);\n    window.addEventListener('scroll', this.onWindowScroll);\n  }\n  componentWillUnmount() { window.removeEventListener('resize', this.updateSize); window.removeEventListener('scroll', this.onWindowScroll); }\n  onWindowScroll = () => {\n    const show = window.scrollY > 400;\n    if (show !== this.state.showBackToTop) this.setState({ showBackToTop: show });\n  };\n  scrollToTop = () => window.scrollTo({ top: 0, behavior: 'smooth' });\n  nameSuggestionFor(categoryKey, subCategory, items) {\n    if (!subCategory) return null;\n    const matches = categoryKey === 'ppe' ? items.filter(i => (i.category || this.ppeCategory(i.name)) === subCategory) : items.filter(i => (i.subCategory || '') === subCategory);\n    if (!matches.length) return null;\n    const counts = {};\n    matches.forEach(i => { counts[i.name] = (counts[i.name] || 0) + 1; });\n    return Object.entries(counts).sort((a, b) => b[1] - a[1])[0][0];\n  }\n  updateSize = () => {\n    const mobile = window.innerWidth < 860;\n    if (mobile === this.state.isMobile) return;\n    this.setState({ isMobile: mobile, sidebarOpen: !mobile });\n  };\n  toggleSidebar = () => this.setState({ sidebarOpen: !this.state.sidebarOpen });\n  toggleSidebarCollapse = () => this.setState({ sidebarCollapsed: !this.state.sidebarCollapsed });\n  toggleSidebarGroup = (key) => this.setState({ sidebarGroupOpen: { ...this.state.sidebarGroupOpen, [key]: !this.state.sidebarGroupOpen[key] } });\n  toggleGroupInventory = () => this.toggleSidebarGroup('inventory');\n  toggleGroupIntake = () => this.toggleSidebarGroup('intake');\n  toggleGroupActivity = () => this.toggleSidebarGroup('activity');\n  toggleChart = (key) => this.setState({ expandedCharts: { ...this.state.expandedCharts, [key]: !this.state.expandedCharts[key] } });\n  toggleChartCat = () => this.toggleChart('cat');\n  toggleChartHealth = () => this.toggleChart('health');\n  toggleChartPR = () => this.toggleChart('pr');\n  toggleChartTx = () => this.toggleChart('tx');\n\n  computeStockStatus(item, targetWeeks) {\n    const weeksCover = item.weeklyUsage > 0 ? item.qty / item.weeklyUsage : 99;\n    const low = weeksCover < targetWeeks;\n    return { weeksCover, low };\n  }\n  computeGasStatus(item) {\n    const weeklyDaily = item.weeklyUsage > 0 ? item.weeklyUsage / 7 : 0;\n    const daysCover = weeklyDaily > 0 ? item.qty / weeklyDaily : 99;\n    return { daysCover, low: daysCover < 6, outOfStock: item.qty === 0 };\n  }\n  consumablesCategory(name) {\n    const n = (name || '').toLowerCase();\n    if (/glove|coverall|safety shoe|rigger boot|helmet|goggle|spectacle|mask|respirator|filter cartridge|apron|sleeve|spats|ear plug/.test(n)) return 'PPE & Safety';\n    if (/cutting disc|grinding disc|flap disc|flap wheel|buffing|scratch brush|abrasive/.test(n)) return 'Cutting & Grinding Discs';\n    if (/regulator|flashback|cutting torch|cutting nozzle|nozzle cleaner|purg(e|ing) hose/.test(n)) return 'Gas Cutting & Regulators';\n    if (/electrode|tungsten|collet|tig torch|ceramic cup|mig |contact tip|welding cable|copper cable|welding wire|wire scratch/.test(n)) return 'Welding Consumables';\n    if (/file$|hammer|try square|ruler|spirit level|hacksaw|drill bit|annular cutter|pilot pin|measuring tape|plumb bob|utility knife/.test(n)) return 'Hand Tools & Measuring';\n    if (/socket|cable|earthing clamp|electrode holder|flood light|insulation tape/.test(n)) return 'Electrical Accessories';\n    if (/paint marker|solid marker|marble chalk|paint brush|paint roller|temperature stick/.test(n)) return 'Marking & Painting';\n    return 'General Consumables';\n  }\n  ppeCategory(name) {\n    const n = (name || '').toLowerCase();\n    if (n.includes('glove')) return 'Gloves';\n    if (n.includes('coverall')) return 'Coveralls';\n    if (n.includes('rigger boot')) return 'Rigger Boots';\n    if (n.includes('safety shoe')) return 'Safety Shoes';\n    if (n.includes('mask')) return 'Masks & Respiratory';\n    if (n.includes('goggle') || n.includes('spectic') || n.includes('glass')) return 'Eye Protection';\n    if (n.includes('ear plug')) return 'Ear Protection';\n    return 'Other';\n  }\n  computePPEStatus(item) {\n    const weeksCover = item.weeklyUsage > 0 ? item.qty / item.weeklyUsage : 99;\n    const daysCover = weeksCover * 7;\n    return { weeksCover, daysCover, low: daysCover < 14, outOfStock: item.qty === 0 };\n  }\n  computeEquipmentStatus(item) {\n    const d = daysBetween(item.certExpiry);\n    if (item.status === 'Quarantine') return { label: 'Quarantine', low: true, tab: 'quarantine', days: d };\n    if (item.status === 'Disposal') return { label: 'Disposal', low: true, tab: 'disposal', days: d };\n    if (item.status === 'Scrap') return { label: 'Scrap', low: true, tab: 'disposal', days: d };\n    if (item.status === 'Repair') return { label: 'Repair', low: true, tab: 'active', days: d };\n    if (!item.certExpiry) return { label: 'Missing Certification', low: true, tab: 'missingCert', days: null };\n    if (d !== null && d < 0) return { label: 'Expired ' + Math.abs(d) + 'd ago', low: true, tab: 'expired', days: d };\n    if (d !== null && d <= 30) return { label: 'Due in ' + d + 'd', low: true, tab: 'dueSoon', days: d };\n    return { label: 'Healthy', low: false, tab: 'active', days: d };\n  }\n  computeAssetStatus(item) {\n    const low = item.condition && item.condition !== 'Good';\n    return { label: item.condition || 'Good', low };\n  }\n  normalizeLocation(raw) {\n    const u = (raw || '').toUpperCase();\n    if (u.includes('QATALUM')) return 'QATALUM';\n    if (u.includes('QAPCO')) return 'QAPCO';\n    if (u.includes('QASCO')) return 'QASCO';\n    if (u.includes('QPI')) return 'QPI';\n    if (u.includes('MIC')) return 'FE-MIC';\n    return (raw || '').trim() || 'FE-MIC';\n  }\n  liftingStatus(item) {\n    const remarks = item.remarks || '';\n    const d = daysBetween(item.certExpiry);\n    if (/expired/i.test(remarks)) return { label: 'Defective \\u2013 TPC Expired', low: true, tab: 'disposal' };\n    if (/quarantine/i.test(remarks)) return { label: 'Quarantine \\u2013 Awaiting Re-certification', low: true, tab: 'quarantine' };\n    if (/repair/i.test(remarks)) return { label: 'Under Repair', low: true, tab: 'active' };\n    if (d !== null && d < 0) return { label: 'Expired ' + Math.abs(d) + 'd ago', lo
